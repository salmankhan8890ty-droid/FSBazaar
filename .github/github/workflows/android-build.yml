name: Build FS Bazaar APK, on: workflow_dispatch, push, branches: - main, jobs:, build:, runs-on: ubuntu-latest, steps: - name: Checkout code uses: actions/checkout@v4 - name: Set up JDK uses: actions/setup-java@v4 with: distribution: temurin, java-version: '17'. - name: Build APK run: if [ ! -f "./gradlew" ]; then echo "ERROR: gradlew file is missing." exit 1; fi chmod +x ./gradlew ./gradlew assembleDebug - name: Upload APK if: success() uses: actions/upload-artifact@v4 with: name: FS-Bazaar-APK, path: app/build/outputs/apk/debug/*.apk۔ اس کے بعد commit
